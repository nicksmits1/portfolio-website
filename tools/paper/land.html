<!doctype html><html><body style="margin:0;background:#120A2A"><canvas id="c" style="display:block;width:100vw;height:100vh"></canvas><script>
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform vec4 uW[8]; uniform int uN; out vec4 o;
float F(vec2 p){ float f=0.12*sin(2.1*p.x+0.6)*cos(1.7*p.y-0.4)+0.08*sin(3.3*p.y+1.2*p.x+1.0);
  for(int i=0;i<8;i++){ if(i>=uN) break; vec2 d=p-uW[i].xy; f-=uW[i].z*exp(-dot(d,d)/(2.0*uW[i].w*uW[i].w)); } return f; }
vec3 ramp(float v){ vec3 a=vec3(13.,7.,34.)/255., b=vec3(42.,22.,112.)/255., c=vec3(112.,68.,232.)/255., d=vec3(238.,107.,96.)/255., e=vec3(255.,214.,191.)/255.;
  if(v<0.3) return mix(a,b,v/0.3); if(v<0.56) return mix(b,c,(v-0.3)/0.26); if(v<0.8) return mix(c,d,(v-0.56)/0.24); return mix(d,e,(v-0.8)/0.2); }
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){ vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uRes.y; float n=13.; float s=clamp((F(p)+0.95)/1.2,0.,1.)*n;
  vec3 c=ramp(clamp(floor(s)/(n-1.),0.,1.)); float e=fract(s), fw=fwidth(s); float line=1.-smoothstep(0.,fw*1.4,min(e,1.-e));
  c=mix(c,c*0.7,line*0.85); c+=(hash(gl_FragCoord.xy)-0.5)*0.035; o=vec4(c,1.); }`;
const VERT=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;
const cv=document.getElementById('c'), W=innerWidth, H=innerHeight, d=2; cv.width=W*d; cv.height=H*d;
const asp=W/H, mode=location.hash.slice(1)||'hero';
const hero={sepsis:[0.12,0.25],sindae:[0.36,0.19],thesis:[0.61,0.3],recsys:[0.86,0.2],fifa:[0.58,0.7],wayfinder:[0.85,0.66]};
const grid={thesis:[0.2,0.3],sindae:[0.5,0.25],recsys:[0.8,0.3],sepsis:[0.2,0.74],wayfinder:[0.5,0.74],fifa:[0.8,0.74]};
const on={thesis:1,fifa:1,sepsis:1};
const pts= mode==='hero' ? Object.values(hero).map(q=>[q[0]*asp,q[1],0.82,0.125]).concat([[0.2*asp,0.74,0.86,0.27]])
  : Object.entries(grid).map(([id,q])=>[q[0]*asp,q[1],0.8*(on[id]?1:0.1),0.16]);
const gl=cv.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x;};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(gl.getUniformLocation(pr,'uRes'),cv.width,cv.height);
const arr=new Float32Array(32);pts.forEach((p,i)=>arr.set(p,i*4));gl.uniform4fv(gl.getUniformLocation(pr,'uW'),arr);gl.uniform1i(gl.getUniformLocation(pr,'uN'),pts.length);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
</script></body></html>
