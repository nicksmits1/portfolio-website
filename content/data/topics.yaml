# Research topics: the minima of the home landscape. Each project lists its topics in its own frontmatter (`topics`,
# home topic first); a topic's minimum filters the project rows to it, and /#<id> links to that filtered list.
# wide and tall: the minimum's place on the desktop and phone hero (the default surface, four bowls), as fractions of
# its width and height. Keep them clear of the name block's flat basin, lower left on desktop and lower half on phones.
# The hero's alternate functions (Himmelblau, Rosenbrock, ripple field) have four minimum slots, filled by the topics in
# this order; with more or fewer than four topics the formula tab offers only the bowls.
